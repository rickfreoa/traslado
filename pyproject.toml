[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "freoa-md-converter"
dynamic = ["version"]
description = "Conversor local com extração nativa, OCR seletivo e rastreabilidade"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "AGPL-3.0-or-later"
license-files = ["LICENCE"]
authors = [{name = "Ricardo Peres Freoa | Stocche Forbes Advogados"}]
keywords = ["markdown", "pdf", "ocr", "rag", "chunks", "provenance"]
dependencies = []

[project.urls]
Homepage = "https://github.com/rickfreoa/traslado"

[project.optional-dependencies]
test = ["markdown-it-py==4.0.0", "mdurl==0.1.2"]
pdf = ["PyMuPDF==1.28.2", "Pillow==12.3.0"]
office = ["python-docx==1.2.0", "openpyxl==3.1.5", "python-pptx==1.0.2"]
images = ["Pillow==12.3.0"]
full = ["PyMuPDF==1.28.2", "Pillow==12.3.0", "python-docx==1.2.0", "openpyxl==3.1.5", "python-pptx==1.0.2"]

[project.scripts]
freoa-md = "freoa_v6.cli:main"
traslado = "freoa_v6.cli:main"
freoa-md-gui = "freoa_v6.gui:main"

[tool.setuptools.dynamic]
version = {attr = "freoa_v6.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
