name: Revocation

# Reemite semanalmente (e por despacho manual) o documento revoked.json com sequence monotônica
# e validade de 14 dias, gera attestation e publica na release fixa 'revocation'.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

env:
  PYTHONUTF8: "1"

jobs:
  revocation:
    name: Emitir revoked.json e publicar attestation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Obter sequence anterior e emitir novo revoked.json
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          PREV_SEQ=0
          if gh release download revocation --pattern "revoked.json" --dir /tmp --clobber 2>/dev/null; then
            PREV_SEQ=$(python -c "import json; print(int(json.load(open('/tmp/revoked.json', encoding='utf-8'))['sequence']))")
          fi
          echo "Sequência anterior: $PREV_SEQ"
          python -I -m traslado.revocation \
            --input revocation/revoked-list.json \
            --previous-sequence "$PREV_SEQ" \
            --output dist/revoked.json
          cat dist/revoked.json
      - name: Attestation de proveniência de revoked.json
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/revoked.json
      - name: Publicar asset na release fixa revocation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view revocation >/dev/null 2>&1; then
            gh release upload revocation dist/revoked.json --clobber
          else
            gh release create revocation dist/revoked.json \
              --title "Revogação — Traslado" \
              --notes "Canal contínuo de revogação (revoked.json) reemitido automaticamente."
          fi
