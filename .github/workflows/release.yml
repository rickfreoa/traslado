name: Release

# Em push de tag v*: build em checkout limpo, SHA256SUMS, attestation e release EM RASCUNHO. Nunca publica.
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  release:
    name: Release em rascunho (Windows)
    runs-on: windows-latest
    permissions:
      contents: write      # criar o release em rascunho
      id-token: write      # assinatura da attestation
      attestations: write  # gravar a attestation
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag igual a v + versão
        run: |
          VERSAO=$(python -c "import re,pathlib; print(re.search(r'^__version__ = \"([^\"]+)\"', pathlib.Path('src/freoa_v6/__init__.py').read_text(encoding='utf-8'), re.M)[1])")
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_NAME" != "v$VERSAO" ]; then
            echo "Tag $GITHUB_REF_NAME diverge da versão v$VERSAO" >&2
            exit 1
          fi
      - name: Inventário de terceiros (A8)
        run: python scripts/inventario.py
      - name: Testes de release e de inventário
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.test_release_t11
      - name: Build em checkout limpo (sem --permitir-sujo)
        run: python scripts/build_release.py
      - name: Nenhum byte de PyMuPDF/MuPDF no ZIP nem no wheel
        run: python scripts/build_release.py --verificar dist/*.zip dist/*.whl
      - name: SHA256SUMS confere e o payload registra checkout limpo
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          python -c "import json,zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); n=[x for x in z.namelist() if x.endswith('/INSTALL-PAYLOAD.json')][0]; assert json.loads(z.read(n))['checkout_limpo'] is True" dist/traslado-"$VERSAO"-windows.zip
      - name: Attestation de proveniência dos bytes distribuídos
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/traslado-${{ env.VERSAO }}-windows.zip
            dist/freoa_md_converter-${{ env.VERSAO }}-py3-none-any.whl
            dist/SHA256SUMS
      - name: Criar release em rascunho (nunca publicar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/traslado-$VERSAO-windows.zip" \
            "dist/freoa_md_converter-$VERSAO-py3-none-any.whl" \
            dist/SHA256SUMS \
            --draft --verify-tag --title "Traslado $VERSAO" \
            --notes "Rascunho gerado por workflow. Revisar SHA256SUMS e a attestation antes de publicar manualmente."
