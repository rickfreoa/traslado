name: CI

# Core e Full em ambientes separados; a suíte roda contra o WHEEL INSTALADO, a partir de uma cópia fora do checkout.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  construir:
    name: Build em checkout limpo (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Build (recusa árvore suja)
        run: python scripts/build_release.py
      - name: Nenhum byte de PyMuPDF/MuPDF nos artefatos
        run: python scripts/build_release.py --verificar dist/*.zip dist/*.whl dist/*.tar.gz dist/install.*
      - run: python scripts/versao.py --conferir --dist dist
      - name: Inventário de terceiros (A8)
        run: python scripts/inventario.py
      - name: Testes de release e de inventário (com checkout)
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.test_release_t11
      - name: Testes que dependem da árvore-fonte (composição, entry points, contrato dos workflows)
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-full.hashes.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements-test.hashes.lock
          python -m unittest -v tests.test_scripts_e6 tests.test_compat_e1 tests.test_lifecycle_e5 tests.test_e5_corrections
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pacote
          path: dist/
          if-no-files-found: error

  testar:
    timeout-minutes: 60
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.perfil }}
    needs: construir
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
        python: ["3.11", "3.12", "3.13", "3.14"]
        perfil: [core, full]
        include:
          - {os: windows-latest, python: "3.13", perfil: legacy}
          - {os: ubuntu-latest, python: "3.13", perfil: legacy}
          - {os: macos-14, python: "3.13", perfil: legacy}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: fonte
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pacote
          path: pacote
      - name: Conferir SHA256SUMS e extrair o pacote distribuído
        run: |
          W="${RUNNER_TEMP//\\//}"
          python - <<'PYEOF'
          import hashlib
          from pathlib import Path
          root = Path('pacote')
          for line in (root/'SHA256SUMS').read_text().splitlines():
              expected, name = line.split()
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == expected, f'SHA256SUMS diverge: {name}'
          PYEOF
          python -m zipfile -e pacote/traslado-*-windows.zip "$W/pkg"
          echo "W=$W" >> "$GITHUB_ENV"
          echo "PKG=$(echo "$W"/pkg/traslado-*)" >> "$GITHUB_ENV"

      - name: Instalação gerenciada (INSTALAR.ps1) e OCR fixado em ocr-assets.lock.json (Windows Full)
        if: runner.os == 'Windows' && matrix.perfil != 'core'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = (Get-ChildItem "$env:RUNNER_TEMP\pkg")[0].FullName
          & "$pkg\INSTALAR.ps1" -Profile Full -Python (Get-Command python).Source `
            -InstallRoot "$env:RUNNER_TEMP\gerenciada" -DataRoot "$env:RUNNER_TEMP\dados" `
            -ShortcutDirectory "$env:RUNNER_TEMP\atalhos" -NoShortcut
          $release = (Get-ChildItem "$env:RUNNER_TEMP\gerenciada\releases")[0].FullName
          Get-Content "$release\installation-doctor.json"
          "T11_TESSERACT=$release\ocr\tesseract.exe" >> $env:GITHUB_ENV
          "T11_EXIGE_OCR=1" >> $env:GITHUB_ENV
          "T11_LANGS=por,eng,spa,ita,fra,deu" >> $env:GITHUB_ENV

      - name: Motor OCR do sistema (Linux Full)
        if: runner.os == 'Linux' && matrix.perfil != 'core'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core xvfb \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-por tesseract-ocr-spa tesseract-ocr-ita tesseract-ocr-fra tesseract-ocr-deu
          command -v tesseract
          tesseract --version
          tesseract --list-langs
          dpkg-query -W -f='${Package} ${Version}\n' 'tesseract-ocr*'
          tesseract --version 2>&1 | head -1 | grep -E '^tesseract 5\.'
          echo "T11_TESSERACT=$(command -v tesseract)" >> "$GITHUB_ENV"
          echo "T11_EXIGE_OCR=1" >> "$GITHUB_ENV"
          echo "T11_LANGS=por,eng,spa,ita,fra,deu" >> "$GITHUB_ENV"

      - name: xvfb para os testes de GUI (Linux Core)
        if: runner.os == 'Linux' && matrix.perfil == 'core'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: OCR macOS Full/legacy (somente CI)
        if: runner.os == 'macOS' && matrix.perfil != 'core'
        run: |
          test "$(uname -m)" = arm64 || { echo "::error::macos-14 deve ser arm64"; exit 1; }
          brew install tesseract tesseract-lang
          tesseract --version
          tesseract --list-langs
          echo "T11_TESSERACT=$(command -v tesseract)" >> "$GITHUB_ENV"
          echo "T11_EXIGE_OCR=1" >> "$GITHUB_ENV"
          echo "T11_LANGS=por,eng,spa,ita,fra,deu" >> "$GITHUB_ENV"

      - name: Venv novo com o wheel construído (não o checkout, não editable)
        run: |
          python -m venv "$W/venv"
          if [ -x "$W/venv/Scripts/python.exe" ]; then PY="$W/venv/Scripts/python.exe"; else PY="$W/venv/bin/python"; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --only-binary=:all: --require-hashes -r "$PKG/requirements-test.hashes.lock"
          if [ "${{ matrix.perfil }}" != "core" ]; then
            "$PY" -m pip install --only-binary=:all: --require-hashes -r "$PKG/requirements-full.hashes.lock"
          fi
          if [ "${{ matrix.perfil }}" = "legacy" ]; then
            "$PY" -m pip install --require-hashes -r "$PKG/locks/requirements-legacy.hashes.lock"
          fi
          "$PY" -m pip install --no-deps --no-index pacote/traslado-*.whl
          # O repositório também contém testes de função pytest; unittest não os executa.
          "$PY" -m pip install pytest==9.1.1
          "$PY" -m pip check
          "$PY" -m pip list

      - name: Comprova TEMP com alias 8.3 (Windows)
        if: runner.os == 'Windows'
        run: |
          "$PY" -I -X utf8 - <<'PYEOF'
          import os, re, sys, tempfile
          from pathlib import Path
          t, tmp = os.environ.get("TEMP", ""), os.environ.get("TMP", "")
          bruto = tempfile.mkdtemp()
          resolvido = Path(bruto).resolve()
          print("TEMP =", t); print("TMP  =", tmp)
          print("mkdtemp =", bruto); print("resolvido =", resolvido)
          erros = []
          if not any(re.search(r"~\d", v) for v in (t, tmp)):
              erros.append("nem TEMP nem TMP contêm alias curto (~N): o runner deixou de expor 8.3")
          if str(resolvido) == bruto:
              erros.append("o caminho resolvido é igual ao bruto")
          if not os.path.samefile(bruto, resolvido):
              erros.append("bruto e resolvido não apontam para o mesmo diretório")
          os.rmdir(bruto)
          if erros:
              sys.exit("FALHA: " + "; ".join(erros))
          PYEOF

      - name: Suíte contra o wheel instalado, fora do checkout
        id: suite
        env:
          T11_EXIGE_INSTALADO: "1"
          T11_PERFIL: ${{ matrix.perfil }}
        run: |
          cp -r fonte/tests "$PKG/tests"
          # Mutações e medições têm jobs bloqueantes próprios; não repetir 27 vezes.
          rm "$PKG/tests/test_mutation_e6.py" "$PKG/tests/test_containment_e2.py"
          cd "$PKG"
          unset PYTHONPATH
          if [ "${{ matrix.perfil }}" = "core" ]; then
            ARGS=(tests/test_release_t11.py --core)
          else
            ARGS=(-m unittest discover -s tests -v)
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$PY" -I -X utf8 "${ARGS[@]}"
          else
            "$PY" -I -X utf8 "${ARGS[@]}"
          fi

      - name: Regressões de função pytest contra wheel instalado
        if: (success() || steps.suite.outcome == 'failure') && matrix.perfil != 'core'
        env:
          T11_EXIGE_INSTALADO: "1"
        run: |
          cd "$PKG"
          unset PYTHONPATH
          "$PY" -I -m pytest -v tests/test_review_e23fix.py


  contencao:
    needs: construir
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, label: windows}
          - {os: ubuntu-latest, label: linux}
          - {os: macos-14, label: macos}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pacote
          path: pacote
      - name: Contenção real contra wheel instalado
        shell: bash
        run: |
          python -m pip install --no-deps pacote/*.whl
          T11_EXIGE_INSTALADO=1 python -I scripts/contencao_e6.py --saida "evidencias/contencao-${{ matrix.label }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: contencao-${{ matrix.label }}
          path: evidencias/
          if-no-files-found: error

  mutacao:
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pacote
          path: pacote
      - name: Mutações nativas e E4 com semente fixa
        env:
          T11_EXIGE_INSTALADO: '1'
          TRASLADO_REQUIRE_NATIVE_FIXTURES: '1'
        run: |
          python -m pip install --require-hashes -r locks/requirements-full.hashes.lock
          python -m pip install --require-hashes -r locks/requirements-legacy.hashes.lock
          python -m pip install --no-deps pacote/*.whl
          python -m unittest -v tests.test_mutation_e6 tests.test_legacy_e4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutacao-evidencias
          path: work/
          if-no-files-found: warn

  e2e:
    name: E2E ${{ matrix.os }} / ${{ matrix.label }}
    needs: construir
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: debian
            image: debian:bookworm-slim@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3
          - os: ubuntu-latest
            label: fedora
            image: quay.io/fedora/fedora-minimal:42@sha256:09a2061e2cfb85ac8e7fa7f2234d0ace6ad4f2b7dfdf0f257c90405e4f07577d
          - {os: windows-2022, label: windows}
          - {os: macos-14, label: macos}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pacote
          path: pacote
      - name: Linux virgem por digest (artefatos locais somente)
        if: runner.os == 'Linux'
        env:
          IMAGE: ${{ matrix.image }}
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p evidencias
          docker run --rm --init -v "$PWD:/workspace:ro" -v "$PWD/pacote:/dist:ro" -v "$PWD/evidencias:/out" \
            "$IMAGE" sh /workspace/scripts/e2e_linux_container.sh "$LABEL"
      - name: Ciclo em perfil temporário Windows/macOS e auditoria Full
        if: runner.os != 'Linux'
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p evidencias
          python -I scripts/e2e_runner.py --mode "$LABEL" --dist "$PWD/pacote" \
            --saida "evidencias/e2e-$LABEL.json" --audit-saida "evidencias/auditoria-libs-$LABEL.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-${{ matrix.label }}
          path: evidencias/
          if-no-files-found: error

  consolidar-contencao:
    if: always()
    needs: contencao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: contencao-*
          path: medicoes
      - name: Tabela consolidada (ausência de prova reprova)
        if: always()
        run: |
          python scripts/resumir_contencao.py medicoes --saida contencao-consolidada.md
      - name: Publicar tabela no resumo do run
        if: always()
        run: cat contencao-consolidada.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: contencao-consolidada
          path: contencao-consolidada.md
          if-no-files-found: error
