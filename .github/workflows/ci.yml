name: CI

# Core e Full em ambientes separados; a suíte roda contra o WHEEL INSTALADO, a partir de uma cópia fora do checkout.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  construir:
    name: Build em checkout limpo (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Build (recusa árvore suja)
        run: python scripts/build_release.py
      - name: Nenhum byte de PyMuPDF/MuPDF nos artefatos
        run: python scripts/build_release.py --verificar dist/*.zip dist/*.whl
      - name: Inventário de terceiros (A8)
        run: python scripts/inventario.py
      - name: Testes de release e de inventário (com checkout)
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.test_release_t11
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pacote
          path: |
            dist/*.zip
            dist/*.whl
            dist/SHA256SUMS
            dist/inventario-divergencias.json
          if-no-files-found: error

  testar:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.perfil }}
    needs: construir
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        perfil: [core, full]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: fonte
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pacote
          path: pacote
      - name: Conferir SHA256SUMS e extrair o pacote distribuído
        run: |
          W="${RUNNER_TEMP//\\//}"
          (cd pacote && sha256sum -c SHA256SUMS)
          python -m zipfile -e pacote/traslado-*-windows.zip "$W/pkg"
          echo "W=$W" >> "$GITHUB_ENV"
          echo "PKG=$(echo "$W"/pkg/traslado-*)" >> "$GITHUB_ENV"

      - name: Instalação gerenciada (INSTALAR.ps1) e OCR fixado em ocr-assets.lock.json (Windows Full)
        if: runner.os == 'Windows' && matrix.perfil == 'full'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = (Get-ChildItem "$env:RUNNER_TEMP\pkg")[0].FullName
          & "$pkg\INSTALAR.ps1" -Profile Full -Python (Get-Command python).Source `
            -InstallRoot "$env:RUNNER_TEMP\gerenciada" -DataRoot "$env:RUNNER_TEMP\dados" `
            -ShortcutDirectory "$env:RUNNER_TEMP\atalhos" -NoShortcut
          $release = (Get-ChildItem "$env:RUNNER_TEMP\gerenciada\releases")[0].FullName
          Get-Content "$release\installation-doctor.json"
          "T11_TESSERACT=$release\ocr\tesseract.exe" >> $env:GITHUB_ENV
          "T11_EXIGE_OCR=1" >> $env:GITHUB_ENV
          "T11_LANGS=por,eng,spa,ita,fra,deu" >> $env:GITHUB_ENV

      - name: Motor OCR do sistema (Linux Full)
        if: runner.os == 'Linux' && matrix.perfil == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core xvfb \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-por tesseract-ocr-spa tesseract-ocr-ita tesseract-ocr-fra tesseract-ocr-deu
          command -v tesseract
          tesseract --version
          tesseract --list-langs
          dpkg-query -W -f='${Package} ${Version}\n' 'tesseract-ocr*'
          tesseract --version 2>&1 | head -1 | grep -E '^tesseract 5\.'
          echo "T11_TESSERACT=$(command -v tesseract)" >> "$GITHUB_ENV"
          echo "T11_EXIGE_OCR=1" >> "$GITHUB_ENV"
          echo "T11_LANGS=por,eng,spa,ita,fra,deu" >> "$GITHUB_ENV"

      - name: xvfb para os testes de GUI (Linux Core)
        if: runner.os == 'Linux' && matrix.perfil == 'core'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Venv novo com o wheel construído (não o checkout, não editable)
        run: |
          python -m venv "$W/venv"
          if [ -x "$W/venv/Scripts/python.exe" ]; then PY="$W/venv/Scripts/python.exe"; else PY="$W/venv/bin/python"; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --only-binary=:all: --require-hashes -r "$PKG/requirements-test.hashes.lock"
          if [ "${{ matrix.perfil }}" = "full" ]; then
            "$PY" -m pip install --only-binary=:all: --require-hashes -r "$PKG/requirements-full.hashes.lock"
          fi
          "$PY" -m pip install --no-deps --no-index pacote/freoa_md_converter-*.whl
          "$PY" -m pip check
          "$PY" -m pip list

      - name: Suíte contra o wheel instalado, fora do checkout
        env:
          T11_EXIGE_INSTALADO: "1"
        run: |
          cp -r fonte/tests "$PKG/tests"
          cd "$PKG"
          unset PYTHONPATH
          if [ "${{ matrix.perfil }}" = "core" ]; then
            ARGS=(tests/test_release_t11.py --core)
          else
            ARGS=(-m unittest discover -s tests -v)
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$PY" -I -X utf8 "${ARGS[@]}"
          else
            "$PY" -I -X utf8 "${ARGS[@]}"
          fi
