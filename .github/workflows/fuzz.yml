name: Fuzzing Noturno (Atheris)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max_total_time:
        description: 'Tempo máximo em segundos por alvo (padrão: 1200 = 20 min)'
        required: false
        default: '1200'
      target:
        description: 'Alvo único opcional (ou "all" para todos os alvos)'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [txt, csv, json, xml, html, docx, xlsx, pptx, pdf, png]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Instalar dependências do alvo e Atheris
        run: |
          python -m pip install -U pip setuptools==82.0.1 wheel==0.46.3
          python -m pip install --require-hashes --only-binary :all: -r locks/requirements-full.hashes.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip install atheris==2.3.0
      - name: Executar fuzzing do alvo (${{ matrix.target }})
        if: github.event.inputs.target == '' || github.event.inputs.target == 'all' || github.event.inputs.target == matrix.target
        env:
          MAX_TIME: ${{ github.event.inputs.max_total_time || '1200' }}
        run: |
          mkdir -p "fuzz-artifacts-${{ matrix.target }}"
          python -I -X utf8 scripts/fuzz_atheris.py \
            --target "${{ matrix.target }}" \
            --max-total-time "$MAX_TIME" \
            --artifacts-dir "fuzz-artifacts-${{ matrix.target }}"
      - name: Publicar achados de fuzzing (se houver)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: fuzz-artifacts-${{ matrix.target }}/
          if-no-files-found: ignore
