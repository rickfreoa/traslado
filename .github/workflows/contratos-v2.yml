name: Contratos v2 (E0)

on:
  push:
    branches: ['release/3.0']
    paths: ['docs/contratos/**', 'scripts/validar_modelo_v2.py', 'scripts/gerar_exemplos_v2.py', 'scripts/conferir_exemplos_v2.py', 'ci/contratos/**', '.github/workflows/contratos-v2.yml']
  pull_request:
    paths: ['docs/contratos/**', 'scripts/validar_modelo_v2.py', 'scripts/gerar_exemplos_v2.py', 'scripts/conferir_exemplos_v2.py', 'ci/contratos/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariantes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Instalar com hashes
        run: |
          python -m pip install --require-hashes --only-binary :all: -r ci/contratos/requirements.hashes.lock
      - name: Esquemas válidos (Draft 2020-12)
        run: |
          python -I -X utf8 -c "import json, jsonschema; [jsonschema.Draft202012Validator.check_schema(json.load(open(f, encoding='utf-8'))) for f in ('docs/contratos/modelo-v2.schema.json', 'docs/contratos/chunks-v2.schema.json')]"
      - name: Exemplos válidos, inválidos e determinismo do gerador
        run: python -I -X utf8 scripts/conferir_exemplos_v2.py
