name: PyPI após publicação
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag v* de release já publicada'
        required: true
      confirmacao:
        description: 'Digite PUBLICAR para autorizar PyPI'
        required: true
permissions:
  contents: read
jobs:
  pypi:
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirmacao == 'PUBLICAR' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Obter apenas wheel e sdist da release publicada
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName > release.json
          python -c 'import json; assert json.load(open("release.json"))["isDraft"] is False, "Release ainda é rascunho"'
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir bytes --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          python - <<'PY'
          import hashlib, os, pathlib, shutil
          root = pathlib.Path('bytes')
          version = os.environ['TAG'][1:]
          names = [f'traslado-{version}-py3-none-any.whl', f'traslado-{version}.tar.gz']
          sums = dict((line.split()[1], line.split()[0]) for line in (root/'SHA256SUMS').read_text().splitlines())
          pathlib.Path('dist').mkdir()
          for name in names:
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == sums[name], f'Hash diverge: {name}'
              shutil.copyfile(root/name, pathlib.Path('dist')/name)
          PY
      - name: Trusted publishing (OIDC; nenhuma senha de PyPI)
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
